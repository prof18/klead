name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  release:
    types: [released, prereleased]

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout release tag
        if: github.event_name == 'release'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout manually selected release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tag runs can't reuse caches they save, so restore the toolchain that CI saved on main.
      - name: Restore Kotlin/Native tooling
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-ios-v2-${{ hashFiles('*.gradle.kts', 'gradle/libs.versions.toml', 'build-logic/src/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Publish to Maven Central
        run: ./gradlew -q --console=plain publishAndReleaseToMavenCentral --no-parallel --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_SONATYPE_CLOSE_TIMEOUT_SECONDS: 3600
