                                                <p>11月20日消息，据特斯拉副总裁陶琳微博显示，昨天（11月19日），马斯克收到一份上海“特”产——工厂同事们自己设计、自己动手制作的全球限量“手办”。</p>                </div><div class="article-content-wrapper">
                    <div class="main__right">
                        <div class="article-content" id="artibody">
                                                    <p>据图片显示，该“手办”为特斯拉旗下车型与上海“三件套”的模型。</p><p>陶琳称，这本来是同事们闲暇时利用边角料创意的兴趣之作，没想到成就了一件绝佳心意。她还透露，“Elon 很喜欢这个设计，特斯拉人不仅仅会造车，浪漫起来也这么硬核，这是上海工厂的特别‘交付’，也是中国精密制造的魅力”。</p><p>图片显示，特斯拉公司汽车业务高级副总裁、大中华区总裁朱晓彤陪同马斯克到访。</p><p><img src="https://n.sinaimg.cn/front20261120ac/350/w690h460/20261120/da37-65b7ad732906e7248e1d03e26a77c92e.jpg" alt=""><br><img src="https://n.sinaimg.cn/front20261120ac/278/w690h388/20261120/5c38-25923cc85e70cc5fde84b03930728ff6.jpg" alt=""><br><img src="https://n.sinaimg.cn/front20261120ac/350/w690h460/20261120/a926-9c4964e5967731985f6443ea2c40d0bf.jpg" alt=""></p>                        </div>
