name: KleadBenchmarkHost
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
targets:
  KleadBenchmarkHost:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prof18.klead.benchmark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - framework: ../ios-device-runner/build/bin/iosArm64/releaseFramework/KleadBenchmarkRunner.framework
        embed: false
    postCompileScripts:
      - name: Install benchmark fixtures
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          RESOURCE_SOURCE="$SRCROOT/../../src/commonTest/resources"
          RESOURCE_DESTINATION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/test-resources"
          mkdir -p "$RESOURCE_DESTINATION"
          ditto "$RESOURCE_SOURCE" "$RESOURCE_DESTINATION"
